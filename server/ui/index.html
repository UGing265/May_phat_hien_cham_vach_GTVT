<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Máy phát hiện chạm vạch GTVT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: radial-gradient(circle at top, #1e293b 0, #020617 45%);
        color: #e5e7eb;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: rgba(2, 6, 23, 0.96);
        border-radius: 18px;
        padding: 20px 18px 18px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(30, 64, 175, 0.6);
        backdrop-filter: blur(16px);
      }

      h1 {
        font-size: 1.3rem;
        margin: 0 0 4px;
      }

      .subtitle {
        font-size: 0.8rem;
        color: #9ca3af;
        margin-bottom: 14px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        padding: 6px 10px;
        border-radius: 999px;
        background: #020617;
        border: 1px solid #1f2937;
        margin-bottom: 14px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ef4444;
        box-shadow: 0 0 8px rgba(248, 113, 113, 0.9);
        transition: background 0.2s ease, box-shadow 0.2s ease;
      }

      .dot.running {
        background: #22c55e;
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
      }

      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 8px;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.12s ease,
          background 0.15s ease, opacity 0.15s ease;
      }

      button:active {
        transform: scale(0.97);
        box-shadow: none;
        opacity: 0.9;
      }

      .btn-primary {
        background: linear-gradient(135deg, #22c55e, #4ade80);
        color: #022c22;
        box-shadow: 0 7px 22px rgba(34, 197, 94, 0.55);
      }

      .btn-danger {
        background: linear-gradient(135deg, #ef4444, #f97373);
        color: #fee2e2;
        box-shadow: 0 7px 22px rgba(248, 113, 113, 0.55);
      }

      .btn-secondary {
        background: #020617;
        color: #e5e7eb;
        border: 1px solid #1f2937;
        box-shadow: 0 5px 18px rgba(15, 23, 42, 0.9);
        width: 100%;
        margin-top: 4px;
      }

      .phone-cam-container {
        margin-top: 12px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #1f2937;
        background: #020617;
      }

      .phone-cam-header {
        padding: 4px 10px;
        font-size: 0.72rem;
        border-bottom: 1px solid #1f2937;
        background: rgba(15, 23, 42, 0.9);
      }

      #phone-video {
        width: 100%;
        display: block;
        max-height: 260px;
        object-fit: cover;
        background: #020617;
      }

      .message {
        font-size: 0.8rem;
        margin-top: 6px;
        min-height: 1em;
      }

      .footer-text {
        margin-top: 8px;
        font-size: 0.72rem;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Máy phát hiện chạm vạch</h1>
      <div class="subtitle">Điều khiển & gửi hình từ iPhone</div>

      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Đang dừng</span>
      </div>

      <div class="btn-group">
        <button id="btn-start" class="btn-primary">Start</button>
        <button id="btn-stop" class="btn-danger">Stop</button>
      </div>

      <button id="btn-sound" class="btn-secondary">
        Phát thử âm thanh
      </button>

      <button id="btn-use-phone-cam" class="btn-secondary">
        Dùng camera iPhone
      </button>

      <div id="phone-cam-container" class="phone-cam-container" style="display:none;">
        <div class="phone-cam-header">Camera iPhone (gửi frame về server)</div>
        <video id="phone-video" playsinline autoplay></video>
        <canvas id="phone-canvas" style="display:none;"></canvas>
      </div>

      <div id="message" class="message"></div>

      <div class="footer-text">
        Mở trang này trên iPhone / trình duyệt cùng mạng với máy chạy Python.
      </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
