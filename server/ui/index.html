<!-- server/templates/index.html -->
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Máy phát hiện chạm vạch GTVT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
        color: #e5e7eb;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: #020617;
        border-radius: 16px;
        padding: 20px 18px 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        border: 1px solid #1f2937;
      }

      h1 {
        font-size: 1.2rem;
        margin: 0 0 4px;
      }

      .subtitle {
        font-size: 0.8rem;
        color: #9ca3af;
        margin-bottom: 16px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        padding: 6px 10px;
        border-radius: 999px;
        background: #111827;
        margin-bottom: 16px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ef4444;
        transition: background 0.2s ease;
      }

      .dot.running {
        background: #22c55e;
      }

      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
      }

      button:active {
        transform: scale(0.97);
        box-shadow: none;
      }

      .btn-primary {
        background: #22c55e;
        color: #022c22;
        box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
      }

      .btn-secondary {
        background: #111827;
        color: #e5e7eb;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.8);
      }

      .btn-danger {
        background: #b91c1c;
        color: #fee2e2;
        box-shadow: 0 4px 12px rgba(185, 28, 28, 0.6);
      }

      .footer-text {
        margin-top: 10px;
        font-size: 0.75rem;
        color: #6b7280;
      }

      .message {
        font-size: 0.8rem;
        margin-top: 6px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Máy phát hiện chạm vạch</h1>
      <div class="subtitle">Điều khiển Raspberry Pi từ iPhone</div>

      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Đang dừng</span>
      </div>

      <div class="btn-group">
        <button id="btn-start" class="btn-primary">Start</button>
        <button id="btn-stop" class="btn-danger">Stop</button>
      </div>

      <button id="btn-sound" class="btn-secondary" style="width:100%; margin-top:4px;">
        Phát thử âm thanh
      </button>

      <div id="message" class="message"></div>

      <div class="footer-text">
        Mở trang này bằng iPhone (Safari/Chrome) khi cùng mạng Wi-Fi với Raspberry Pi.
      </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
